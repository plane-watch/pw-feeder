---
name: Pull Request

"on":
  # Enable manual running of action if necessary
  workflow_dispatch:
  # Test build/deploy on PRs to main/master
  pull_request:
    # Only publish on push to main branch
    branches:
      - main
    # Don't trigger if it's just a documentation update
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '**.yml'
      - '.gitattributes'
      - '.gitignore'
  push:
    # Only publish on push to main branch
    branches:
      - main
    # Don't trigger if it's just a documentation update
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '**.yml'
      - '.gitattributes'
      - '.gitignore'

jobs:

  tests:
    name: Test pw-feeder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.25.0'
      - name: "go mod tidy"
        run: |
          cd pw-feeder
          go mod tidy
      - name: "go generate"
        run: |
          cd pw-feeder
          go generate ./...
      - name: "go test"
        run: |
          cd pw-feeder
          go test -v -race -timeout=300s -count=3 \
            -coverprofile=coverage.txt ./...
